name: Build APK

# Tự động build file APK mỗi khi bạn đẩy code lên nhánh main,
# hoặc bấm "Run workflow" thủ công trong tab Actions trên GitHub.
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android platform folder
        run: flutter create . --platforms=android --org com.tpro.quetqrtpro

      - name: Locate generated Kotlin package
        id: pkg
        run: |
          MAIN_ACTIVITY=$(find android -name "MainActivity.kt" | head -n 1)
          PKG_DIR=$(dirname "$MAIN_ACTIVITY")
          PKG_NAME=$(grep '^package ' "$MAIN_ACTIVITY" | sed 's/package //')
          echo "dir=$PKG_DIR" >> "$GITHUB_OUTPUT"
          echo "name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "Found package: $PKG_NAME in $PKG_DIR"

      - name: Rebrand app label to "Quét QR Tpro"
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Quét QR Tpro"/' android/app/src/main/AndroidManifest.xml

      - name: Add Camera + AdMob permissions and App ID
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # Permissions + hardware features, each inserted right after the opening <manifest ...> tag
          sed -i '/<manifest /a\    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />' "$MANIFEST"
          sed -i '/<manifest /a\    <uses-feature android:name="android.hardware.camera" android:required="true" />' "$MANIFEST"
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST"
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"
          # AdMob TEST App ID — replace with your real one before publishing (see SETUP.md)
          sed -i '/android:icon="@mipmap\/ic_launcher">/a\        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>' "$MANIFEST"

      - name: Lower minSdkVersion to 21 (required by camera + ML Kit)
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter\.minSdkVersion/minSdk = 21/' android/app/build.gradle.kts
            sed -i 's/minSdk = [0-9]\+/minSdk = 21/' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 21/' android/app/build.gradle
            sed -i 's/minSdkVersion [0-9]\+/minSdkVersion 21/' android/app/build.gradle
          fi

      - name: Enable multidex (ML Kit + AdMob push past the 64k method limit)
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i '/applicationId/a\        multiDexEnabled = true' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i '/applicationId/a\        multiDexEnabled true' android/app/build.gradle
          fi

      - name: Install Native Ad factory (Kotlin + layout)
        run: |
          PKG_DIR="${{ steps.pkg.outputs.dir }}"
          PKG_NAME="${{ steps.pkg.outputs.name }}"
          mkdir -p android/app/src/main/res/layout
          cp ci_assets/list_tile_native_ad.xml android/app/src/main/res/layout/list_tile_native_ad.xml
          sed "s/__PACKAGE__/$PKG_NAME/" ci_assets/MainActivity.kt.template > "$PKG_DIR/MainActivity.kt"
          sed "s/__PACKAGE__/$PKG_NAME/" ci_assets/ListTileNativeAdFactory.kt.template > "$PKG_DIR/ListTileNativeAdFactory.kt"

      - name: Get dependencies
        run: flutter pub get

      - name: Ensure CMake toolchain is available (SDK manager download is flaky on GH runners)
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          CMAKE_BIN="$SDK_ROOT/cmake/3.22.1/bin/cmake"

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name "sdkmanager" 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            for i in 1 2 3; do
              if [ -x "$CMAKE_BIN" ]; then break; fi
              yes | "$SDKMANAGER" "cmake;3.22.1" || true
              if [ -x "$CMAKE_BIN" ]; then break; fi
              echo "sdkmanager attempt $i did not produce a working cmake binary, cleaning and retrying..."
              rm -rf "$SDK_ROOT/cmake/3.22.1" 2>/dev/null || true
              sleep 5
            done
          fi

          if [ ! -x "$CMAKE_BIN" ]; then
            echo "SDK-managed CMake unavailable, falling back to the system cmake package"
            sudo apt-get update -y
            sudo apt-get install -y cmake ninja-build
            mkdir -p "$(dirname "$CMAKE_BIN")"
            ln -sf "$(command -v cmake)" "$CMAKE_BIN"
            for tool in ctest cpack ninja; do
              if command -v "$tool" >/dev/null 2>&1; then
                ln -sf "$(command -v "$tool")" "$(dirname "$CMAKE_BIN")/$tool"
              fi
            done
          fi

          echo "Using CMake at $CMAKE_BIN:"
          "$CMAKE_BIN" --version

      - name: Build release APK (test-signed with the default debug key)
        run: |
          set +e
          status=1
          for i in 1 2 3; do
            echo "=== Build attempt $i ==="
            flutter build apk --release
            status=$?
            if [ "$status" -eq 0 ]; then
              break
            fi
            echo "Build attempt $i failed (exit $status), retrying..."
            sleep 10
          done
          set -e
          exit "$status"

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/QuetQRTpro-test.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quet-qr-tpro-apk
          path: build/app/outputs/flutter-apk/QuetQRTpro-test.apk
